      const clean = val.replace(/^[^\w가-힣A-Za-z]+/, '').trim() || val;
      const overlayEl = document.getElementById('overlayTitle');
      if (overlayEl) overlayEl.textContent = val;
      const spinnerEl = document.getElementById('spinnerTitle');
      if (spinnerEl) spinnerEl.textContent = clean;
    }
  }, { onlyOnce: true });
} catch(e) {}
document.body.appendChild(overlay);

document.getElementById('googleLoginBtn').onclick = async () => {
  try { await signInWithPopup(auth, provider); }
  catch(e) {
    const err = document.getElementById('authError');
    err.textContent = '로그인 실패: ' + e.message;
    err.style.display = 'block';
  }
};

onAuthStateChanged(auth, (user) => {
  if (user) {
    overlay.style.display = 'none';
    const hero = document.querySelector('.hero-content');
    if (hero && !document.getElementById('userBadge')) {
      const badge = document.createElement('div');
      badge.id = 'userBadge';
      badge.style.cssText = 'position:absolute;top:10px;right:14px;display:flex;align-items:center;gap:6px;';
      badge.innerHTML = `<img src="${user.photoURL||''}" width="24" height="24" style="border-radius:50%;border:2px solid rgba(255,255,255,.3);" onerror="this.style.display='none'">
        <button onclick="window.doSignOut()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:3px 10px;font-size:11px;cursor:pointer;">로그아웃</button>`;
      hero.appendChild(badge);
    }

    window._fb = { set, ref, db };
    window._fbReady = true;
    window._fbMod = { onValue };

    // 데이터 로드 완료 시 스피너 제거
    function _checkAllLoaded() {
      const spinner = document.getElementById('loadSpinner');
      if (spinner && !spinner._removing) {
        spinner._removing = true;
        spinner.classList.add('hidden');
        setTimeout(() => spinner.remove(), 350);
      }
    }
    // 안전장치: 최대 5초 후 무조건 제거
    setTimeout(_checkAllLoaded, 5000);

    const dbRef = ref(db, 'danang_deleted');
    window.persistDelete = function(cardId) {
      const deleted = JSON.parse(localStorage.getItem('danang_deleted') || '[]');
      if (!deleted.includes(cardId)) deleted.push(cardId);
      localStorage.setItem('danang_deleted', JSON.stringify(deleted));
      set(dbRef, deleted);
    };

    const cardsRef = ref(db, 'danang_cards');
    // 카드 로드
    onValue(cardsRef,(snap)=>{
      if(window._newTripMode){window._newTripMode=false;return;}
      const cards=snap.val();
      if(!Array.isArray(cards))return;
      const tabOrder={};
      cards.forEach(c=>{
        if(!c||!c.id||!c.tab)return;
        if(!tabOrder[c.tab])tabOrder[c.tab]=[];
        tabOrder[c.tab].push(c);
      });
      Object.entries(tabOrder).forEach(([tabId,tabCards])=>{
        let container=document.querySelector('#'+tabId+' .cards');
        if(!container)container=document.querySelector('#day0 .cards');
        if(!container)return;
        tabCards.forEach(c=>{
          let el=document.getElementById(c.id);
          if(!el){
            container.insertAdjacentHTML('beforeend',buildCard(c.id,c));
            el=document.getElementById(c.id);
          }
          if(el)container.appendChild(el);
        });
      });
      setTimeout(()=>{
        document.querySelectorAll('.card').forEach(card=>{
          if(!card.querySelector('.btn-card-delete'))attachCardButtons(card.id);
        });
        // 스피너 제거
        const spinner=document.getElementById('loadSpinner');
        if(spinner&&!spinner._removing){
          spinner._removing=true;
          spinner.classList.add('hidden');
          setTimeout(()=>spinner.remove(),350);
        }
      },200);
    },{onlyOnce:true});

    // ── 제목 불러오기 ──
    onValue(ref(db, 'danang_title'), (snap) => {
      if (snap.val()) document.getElementById('heroTitle').textContent = snap.val();
    }, { onlyOnce: true });

    // ── 날짜 불러오기 ──
    onValue(ref(db, 'danang_date'), (snap) => {
      if (snap.val()) document.getElementById('heroDate').textContent = snap.val();
      _checkAllLoaded();
    }, { onlyOnce: true });

    // ── 탭 라벨 불러오기 ──
    onValue(ref(db, 'danang_tab_labels'), (snap) => {
      const labels = snap.val();
      if (!labels) return;
      Object.entries(labels).forEach(([dayId, val]) => {
        const el = document.getElementById('tabl-' + dayId);
        if (el) el.textContent = val;
        DAY_LABELS[dayId] = val;
      });
    }, { onlyOnce: true });

    // ── 추가 탭 복원 ──
    onValue(ref(db, 'danang_tab_count'), (snap) => {
      const count = snap.val();
      if (!count || count <= 6) return;
      for (let i = 7; i <= count; i++) {
        const newId = 'day' + i;
        if (document.getElementById(newId)) continue;
        const tabScroll = document.querySelector('.tab-scroll');
        const divider = tabScroll.querySelector('div[style*="background:var(--border)"]');
        const newBtn = document.createElement('button');
        newBtn.className = 'tab-btn';
        newBtn.onclick = function(){ showTab(newId, this); };
        newBtn.innerHTML = `<span id="tabl-${newId}" ondblclick="editTabLabel(event,'${newId}')">Day${i}</span>`;
        if (divider) tabScroll.insertBefore(newBtn, divider);
        else tabScroll.appendChild(newBtn);
        const archiveContent = document.getElementById('archive');
        const newContent = document.createElement('div');
        newContent.className = 'tab-content';
        newContent.id = newId;
        newContent.innerHTML = `<div class="day-banner blue"><div class="db-left"><div class="db-day" id="banner-${newId}" contenteditable="true" style="outline:none;cursor:text;" onblur="saveBanner('${newId}',this.textContent)">DAY ${i}</div></div></div><div class="cards"></div>`;
        archiveContent.parentElement.insertBefore(newContent, archiveContent);
        DAY_LABELS[newId] = 'Day' + i;
      }
    }, { onlyOnce: true });

    // ── 배너 텍스트 불러오기 ──
    onValue(ref(db, 'danang_banners'), (snap) => {
      const banners = snap.val();
      if (!banners) return;
      Object.entries(banners).forEach(([dayId, val]) => {
        const el = document.getElementById('banner-' + dayId);
        if (el) el.textContent = val;
      });
      _checkAllLoaded(); // cards 로드 완료 → 스피너 제거
    }, { onlyOnce: true });

    onValue(dbRef, (snapshot) => {
      const deleted = snapshot.val();
      if (!Array.isArray(deleted)) return;
      localStorage.setItem('danang_deleted', JSON.stringify(deleted));
      const apply = () => deleted.forEach(id => {
        const card = document.getElementById(id);
        if (card) card.remove();
      });
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', apply);
      else apply();
      _checkAllLoaded();
    });
  } else {
    overlay.style.display = 'flex';
    // 로그인 안 됐으면 스피너 즉시 제거
    const spinner = document.getElementById('loadSpinner');
    if (spinner) spinner.remove();
  }
});

window.doSignOut = () => signOut(auth);
</script>

<script>
function showTab(id,btn){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function showArchive(btn){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('archive').classList.add('active');
  btn.classList.add('active');
  btn.style.borderBottomColor='#7c3aed';
  window.scrollTo({top:0,behavior:'smooth'});
  renderArchive();
}

function toggle(cardId){
  const detail=document.getElementById('detail-'+cardId);
  const chev=document.getElementById('chev-'+cardId);
  if(!detail)return;
  const isOpen=detail.classList.toggle('open');
  chev&&chev.classList.toggle('open',isOpen);
}

window.addEventListener('scroll',()=>{
  const scrolled=window.scrollY;
  const total=document.body.scrollHeight-window.innerHeight;
  const bar=document.getElementById('progressBar');
  if(bar)bar.style.width=(total>0?scrolled/total*100:0)+'%';
});

function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2000);
}

let editingCardId=null;

function openSheet(cardId){
  editingCardId=cardId||null;
  const isEdit=!!cardId;
  document.getElementById('sheetTitle').textContent=isEdit?'일정 수정':'일정 추가';
  if(isEdit){
    const card=document.getElementById(cardId);
    const tabContent=card.closest('.tab-content');
    document.getElementById('f_day').value=tabContent?tabContent.id:'day1';
    document.getElementById('f_time').value=card.dataset.time||'';
    document.getElementById('f_name').value=card.dataset.name||'';
    document.getElementById('f_icon').value=card.dataset.icon||'🗺️';
    document.getElementById('f_tag').value=card.dataset.tag||'';
    document.getElementById('f_tag_style').value=card.dataset.tagStyle||'tag-blue';
    document.getElementById('f_place').value=card.dataset.place||'';
    document.getElementById('f_cost').value=card.dataset.cost||'';
    document.getElementById('f_duration').value=card.dataset.duration||'';
    document.getElementById('f_tip').value=card.dataset.tip||'';
    clearAllImgSlots();
    try{
      const imgs=JSON.parse(card.dataset.imgs||'[]');
      if(imgs.length)loadImgsToSlots(imgs);
    }catch(e){clearAllImgSlots();}
  }else{
    document.getElementById('f_time').value='';
    document.getElementById('f_name').value='';
    document.getElementById('f_icon').value='🗺️';
    document.getElementById('f_tag').value='';
    document.getElementById('f_tag_style').value='tag-blue';
    document.getElementById('f_place').value='';
    document.getElementById('f_cost').value='';
    document.getElementById('f_duration').value='';
    document.getElementById('f_tip').value='';
    const activeTab=document.querySelector('.tab-content.active');
    document.getElementById('f_day').value=activeTab?activeTab.id:'day1';
    clearAllImgSlots();
    addImgSlot();// 기본 슬롯 하나
  }
  // 날(Day) 옵션 동적 생성
  const fday = document.getElementById('f_day');
  const savedVal = fday.value;
  fday.innerHTML = '';
  document.querySelectorAll('.tab-content').forEach(tab => {
    if(tab.id === 'archive') return;
    const labelEl = document.getElementById('tabl-' + tab.id);
    const label = labelEl ? labelEl.textContent : tab.id;
    const opt = document.createElement('option');
    opt.value = tab.id;
    opt.textContent = label;
    fday.appendChild(opt);
  });
  // 이전 선택값 또는 현재 탭 복원
  const activeTab = document.querySelector('.tab-content.active');
  const defaultVal = savedVal || (activeTab && activeTab.id !== 'archive' ? activeTab.id : 'day0');
  fday.value = defaultVal;

  document.getElementById('sheetBackdrop').classList.add('open');
}

function closeSheet(){document.getElementById('sheetBackdrop').classList.remove('open');editingCardId=null;}
function onBackdropClick(e){if(e.target===document.getElementById('sheetBackdrop'))closeSheet();}

let _uid=Date.now();
function uid(){return 'uc'+(_uid++);}

function buildCard(id,data){
  const tipHtml=data.tip?`<div class="notice-box blue" style="margin-top:10px;"><div class="notice-title">💡 메모 / 꿀팁</div><div class="notice-text" style="word-break:break-all;">${linkify(data.tip.replace(/\n/g,'<br>'))}</div></div>`:'';
  const costHtml=data.cost?`<div class="info-row"><div class="info-icon">💰</div><div class="info-content"><div class="info-label">예상 비용</div><div class="info-value">${data.cost}</div></div></div>`:'';
  const durHtml=data.duration?`<div class="info-row"><div class="info-icon">⏱️</div><div class="info-content"><div class="info-label">소요 시간</div><div class="info-value">${data.duration}</div></div></div>`:'';
  const placeHtml=data.place?`<div class="info-row"><div class="info-icon">📍</div><div class="info-content"><div class="info-label">장소</div><div class="info-value">${data.place}</div></div></div>`:'';

  const imgsHtml=(()=>{
    try{
      const arr=JSON.parse(data.imgs||'[]');
      if(!arr.length)return '';
      return '<div style="display:flex;flex-direction:column;gap:12px;margin-bottom:12px;">'+
        arr.map(item=>{
          const src=typeof item==='string'?item:(item.src||'');
          const cap=typeof item==='string'?'':(item.caption||'');
          if(!src)return '';
          return '<div style="display:flex;flex-direction:column;gap:4px;">'+
            '<img src="'+src+'" style="width:100%;height:auto;display:block;border-radius:10px;">'+
            (cap?'<div style="font-size:12px;color:#475569;padding:2px 6px;line-height:1.5;word-break:break-all;">'+linkify(cap)+'</div>':'')+
            '</div>';
        }).join('')+
        '</div>';
    }catch{return '';}
  })();

  const timeHtml=(t=>{
    if(!t)return '<div class="card-time-col"><div class="card-time-empty">—</div></div>';
    const first=t.split(/\s*[—–-]\s*/)[0].trim();
    const m=first.match(/^(\d{1,2}):(\d{2})/);
    if(m){
      const h=parseInt(m[1]),mn=m[2];
      const ampm=h<12?'오전':'오후';
      const cls=h<12?'am':'pm';
      return `<div class="card-time-col ${cls}"><div class="card-time-hm">${String(h).padStart(2,'0')}:${mn}</div><div class="card-time-ampm">${ampm}</div></div>`;
    }
    return `<div class="card-time-col"><div class="card-time-hm" style="font-size:11px">${first}</div></div>`;
  })(data.time);

  const _hasNote=!!(data.tip||data.place||data.cost||data.duration||(data.imgs&&data.imgs!=='[]'&&data.imgs!=='null'));
  const _noteClass=_hasNote?'has-note':'';
  return `<div class="card ${_noteClass}" id="${id}"
    data-time="${data.time||''}"
    data-name="${(data.name||'').replace(/"/g,'&quot;')}"
    data-icon="${data.icon||'🗺️'}"
    data-tag="${(data.tag||'').replace(/"/g,'&quot;')}"
    data-tag-style="${data.tagStyle||'tag-blue'}"
    data-place="${(data.place||'').replace(/"/g,'&quot;')}"
    data-cost="${(data.cost||'').replace(/"/g,'&quot;')}"
    data-duration="${(data.duration||'').replace(/"/g,'&quot;')}"
    data-tip="${(data.tip||'').replace(/"/g,'&quot;').replace(/\n/g,'&#10;')}"
    data-imgs='${(data.imgs||"[]")}'>
    <div class="card-header" onclick="toggle('${id}')">
      ${timeHtml}
      <div class="card-meta">
        <div class="card-name">${data.name||'새 일정'}</div>
        ${data.place?`<div class="card-place">${data.place}</div>`:''}
      </div>
      <div class="card-right">
        ${data.tag?`<span class="tag ${data.tagStyle||'tag-blue'}">${data.tag}</span>`:''}
        <div class="card-move-btns" onclick="event.stopPropagation()">
          <button class="btn-move-card" onclick="moveCard('${id}',-1)">↑</button>
          <button class="btn-move-card" onclick="moveCard('${id}',1)">↓</button>
        </div>
        <span class="chevron" id="chev-${id}">⌄</span>
      </div>
    </div>
    <div class="card-detail" id="detail-${id}">
      <div class="detail-body">
        ${imgsHtml}${placeHtml}${costHtml}${durHtml}${tipHtml}
        <div class="card-edit-bar">
          <button class="btn-edit-action danger" onclick="deleteCard('${id}')">🗑 삭제</button>
          <button class="btn-edit-action" onclick="moveCard('${id}',-1)">↑ 위로</button>
          <button class="btn-edit-action" onclick="moveCard('${id}',1)">↓ 아래로</button>
          <button class="btn-edit-action primary" onclick="openMoveDay('${id}')">📅 날짜이동</button>
          <button class="btn-edit-action" onclick="event.stopPropagation();openSheet('${id}')">✏️ 수정</button>
        </div>
      </div>
    </div>
  </div>`;
}

function saveItem(){
  const name=document.getElementById('f_name').value.trim();
  if(!name){alert('일정명을 입력하세요.');return;}
  const data={
    time:document.getElementById('f_time').value,
    name,
    icon:document.getElementById('f_icon').value,
    tag:document.getElementById('f_tag').value.trim(),
    tagStyle:document.getElementById('f_tag_style').value,
    place:document.getElementById('f_place').value.trim(),
    cost:document.getElementById('f_cost').value.trim(),
    duration:document.getElementById('f_duration').value.trim(),
    tip:document.getElementById('f_tip').value.trim(),
    imgs:JSON.stringify(getImgsData()),
  };
  if(editingCardId){
    const oldCard=document.getElementById(editingCardId);
    if(oldCard){
      const wrapper=document.createElement('div');
      wrapper.innerHTML=buildCard(editingCardId,data);
      const newCard=wrapper.firstElementChild;
      oldCard.replaceWith(newCard);
      const newTabId=document.getElementById('f_day').value;
      const currentTab=newCard.closest('.tab-content');
      if(!currentTab||currentTab.id!==newTabId){
        const targetCards=document.querySelector('#'+newTabId+' .cards');
        if(targetCards)targetCards.appendChild(newCard);
      }
      attachCardButtons(editingCardId);
      showToast('✅ 수정되었습니다');
      highlightCard(editingCardId);
    }
  }else{
    const targetTabId=document.getElementById('f_day').value;
    const targetCards=document.querySelector('#'+targetTabId+' .cards');
    if(!targetCards){alert('해당 탭을 찾을 수 없습니다.');return;}
    const id=uid();
    targetCards.insertAdjacentHTML('beforeend',buildCard(id,data));
    // 해당 탭 버튼 찾아서 전환
    const targetSpan=document.getElementById('tabl-'+targetTabId);
    const targetBtn=targetSpan?targetSpan.closest('.tab-btn'):null;
    if(targetBtn)showTab(targetTabId,targetBtn);
    showToast('✅ 일정이 추가되었습니다');
    setTimeout(()=>{highlightCard(id);attachCardButtons(id);},300);
  }
  saveCardsToFirebase();
  closeSheet();
}

function moveCard(cardId,dir){
  const card=document.getElementById(cardId);if(!card)return;
  const container=card.parentElement;
  const cards=Array.from(container.children);
  const idx=cards.indexOf(card);
  if(dir===-1&&idx>0){container.insertBefore(card,cards[idx-1]);showToast('⬆️ 위로 이동했습니다');}
  else if(dir===1&&idx<cards.length-1){container.insertBefore(cards[idx+1],card);showToast('⬇️ 아래로 이동했습니다');}
  highlightCard(cardId);saveCardsToFirebase();
}

function deleteCard(cardId){
  if(!confirm('이 일정을 삭제할까요?'))return;
  const card=document.getElementById(cardId);
  if(card){
    card.style.transition='opacity .25s,transform .25s';
    card.style.opacity='0';card.style.transform='translateX(30px)';
    setTimeout(()=>{
      card.remove();
      if(typeof window.persistDelete==='function')window.persistDelete(cardId);
      saveCardsToFirebase();
    },250);
    showToast('🗑 삭제되었습니다');
  }
}

function highlightCard(cardId){
  const card=document.getElementById(cardId);if(!card)return;
  card.classList.add('highlight');
  card.scrollIntoView({behavior:'smooth',block:'nearest'});
  setTimeout(()=>card.classList.remove('highlight'),1200);
}

function attachCardButtons(cardId){
  const card=document.getElementById(cardId);if(!card)return;
  const right=card.querySelector('.card-right');
  if(!right)return;
  const id=cardId;

  // ↑↓ 버튼 — 없을 때만 추가
  if(!right.querySelector('.card-move-btns')){
    const moveBtns=document.createElement('div');
    moveBtns.className='card-move-btns';
    moveBtns.setAttribute('onclick','event.stopPropagation()');
    moveBtns.innerHTML=`<button class="btn-move-card" onclick="moveCard('${id}',-1)">↑</button><button class="btn-move-card" onclick="moveCard('${id}',1)">↓</button>`;
    const chev=right.querySelector('.chevron');
    if(chev)right.insertBefore(moveBtns,chev);else right.appendChild(moveBtns);
  }

  // ✕ 📅 버튼 — 없을 때만 추가
  if(!card.querySelector('.btn-card-delete')){
    const moveBtn=document.createElement('button');
    moveBtn.className='btn-card-delete date-btn';
    moveBtn.innerHTML='📅';
    moveBtn.onclick=(e)=>{e.stopPropagation();openMoveDay(id);};
    const delBtn=document.createElement('button');
    delBtn.className='btn-card-delete';delBtn.innerHTML='✕';
    delBtn.onclick=(e)=>{e.stopPropagation();deleteCard(id);};
    const chev2=right.querySelector('.chevron');
    if(chev2){right.insertBefore(delBtn,chev2);right.insertBefore(moveBtn,delBtn);}
    else{right.appendChild(moveBtn);right.appendChild(delBtn);}
  }

  // 수정 버튼
  const detail=card.querySelector('.card-detail');
  if(detail&&!detail.querySelector('.btn-always-edit')){
    const editBtn=document.createElement('button');
    editBtn.className='btn-always-edit';
    editBtn.style.cssText='margin:12px 16px 16px;width:calc(100% - 32px);padding:11px;border-radius:10px;border:1px solid var(--border);background:#f1f5f9;color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;display:block;';
    editBtn.textContent='✏️ 내용 수정';
    editBtn.onclick=(e)=>{e.stopPropagation();openSheet(id);};
    detail.appendChild(editBtn);
  }

  // 오전/오후 색상
  const timeCol=card.querySelector('.card-time-col');
  if(timeCol&&!timeCol.classList.contains('am')&&!timeCol.classList.contains('pm')){
    const hm=timeCol.querySelector('.card-time-hm');
    const ampm=timeCol.querySelector('.card-time-ampm');
    if(hm&&ampm){
      const h=parseInt(hm.textContent);
      if(!isNaN(h)){timeCol.classList.add(h<12?'am':'pm');ampm.textContent=h<12?'오전':'오후';}
    }
  }

  // 기록(tip/place/cost/duration/imgs) 있으면 파란 하이라이트
  const hasNote=!!(card.dataset.tip||card.dataset.place||card.dataset.cost||card.dataset.duration||(card.dataset.imgs&&card.dataset.imgs!=='[]'&&card.dataset.imgs!=='null'));
  card.classList.toggle('has-note',hasNote);
  const namEl=card.querySelector('.card-name');
  if(namEl&&!namEl.querySelector('.card-note-dot')){
    if(hasNote){
      const dot=document.createElement('span');
      dot.className='card-note-dot';
      namEl.appendChild(dot);
    }
  }
}

document.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('.card').forEach(card=>attachCardButtons(card.id));
  document.querySelectorAll('.card-time-col').forEach(col=>{
    const hm=col.querySelector('.card-time-hm');
    const ampm=col.querySelector('.card-time-ampm');
    if(!hm||!ampm)return;
    const h=parseInt(hm.textContent);
    if(!isNaN(h)){col.classList.add(h<12?'am':'pm');ampm.textContent=h<12?'오전':'오후';}
    else col.classList.add(ampm.textContent.trim()==='오전'?'am':'pm');
  });
});

let editMode=false;
function toggleEditMode(){
  editMode=!editMode;
  document.body.classList.toggle('edit-mode',editMode);
  const fab=document.getElementById('editFab');
  fab.textContent=editMode?'✅':'✏️';
  fab.classList.toggle('edit-active',editMode);
  // 여행기록 탭이 열려있으면 재렌더링
  if(document.getElementById('archive')?.classList.contains('active')){
    renderArchive();
  }
}

let moveDayTargetId=null;
const DAY_LABELS={day0:'출발전',day1:'Day1',day2:'Day2',day3:'Day3',day4:'Day4',day5:'Day5',day6:'귀국'};

function openMoveDay(cardId){
  moveDayTargetId=cardId;
  const sheet=document.getElementById('moveDaySheet');
  const list=document.getElementById('moveDayList');
  const card=document.getElementById(cardId);
  const currentTab=card.closest('.tab-content')?.id;

    id===currentTab?'':`<button class="move-day-btn" onclick="confirmMoveDay('${id}')">${label}</button>`
  ).join('');

function confirmMoveDay(targetTabId){
  const card=document.getElementById(moveDayTargetId);
  const targetCards=document.querySelector('#'+targetTabId+' .cards');
  if(card&&targetCards){targetCards.appendChild(card);showToast('📅 '+DAY_LABELS[targetTabId]+'로 이동했습니다');saveCardsToFirebase();}

function closeMoveDay(){document.getElementById('moveDaySheet').classList.remove('open');moveDayTargetId=null;}

// ── 여행기록 ──
const ARCHIVE_COLORS = ["#0891b2","#d97706","#059669","#7c3aed","#dc2626","#0f172a"];

function renderArchive(){
  if(!window._fbReady)return;
  const list=document.getElementById("archiveList");
  const{ref:fbRef,db:fbDb}=window._fb;
  const{onValue}=window._fbMod||{};
  if(!onValue)return;
  onValue(fbRef(fbDb,"danang_archive"),(snap)=>{
    const trips=snap.val()||[];
    const current={name:document.getElementById("heroTitle").textContent.trim(),date:document.getElementById("heroDate").textContent.trim(),color:"#0891b2",current:true};
    list.innerHTML="";
    const currentCard=makeArchiveCard(current,null,true);
    list.appendChild(currentCard);
    [...trips].reverse().forEach((t,i)=>{
      const card=makeArchiveCard(t,trips.length-1-i,false);
      list.appendChild(card);
    });
    const addBtn=document.createElement("button");
    addBtn.className="archive-add-btn";
    addBtn.textContent="💾 현재 여행을 기록으로 저장";
    addBtn.onclick=saveCurrentToArchive;
    list.appendChild(addBtn);
    const newTripBtn=document.createElement("button");
    newTripBtn.className="archive-add-btn";
    newTripBtn.style.cssText="border-color:#0891b2;color:#0891b2;margin-top:6px;";
    newTripBtn.textContent="✈️ 새 여행 시작 (제목·날짜 초기화)";
    newTripBtn.onclick=startNewTrip;
    list.appendChild(newTripBtn);
  },{onlyOnce:true});
}

function makeArchiveCard(trip,idx,isCurrent){
  const div=document.createElement("div");
  div.className="archive-trip-card";
  div.style.cssText="position:relative;";

  const header=document.createElement("div");
  header.className="archive-trip-header";
  header.innerHTML=`<div class="archive-trip-dot" style="background:${trip.color||"#94a3b8"}"></div><div class="archive-trip-info"><div class="archive-trip-name">${trip.name||"여행"}</div><div class="archive-trip-date">${trip.date||""}</div></div>${isCurrent?"<span class=\"archive-trip-badge\">현재 여행</span>":"<span style=\"font-size:16px;color:#94a3b8;\">⌄</span>"}`;
  div.appendChild(header);

  // 상세 영역 (이전 여행만)
  if(!isCurrent&&idx!==null){
    const detail=document.createElement("div");
    detail.className="archive-trip-detail";
    detail.style.cssText="display:none;border-top:1px solid #f1f5f9;padding:12px 16px;";

    if(trip.cards&&trip.cards.length){
      trip.cards.forEach(c=>{
        const row=document.createElement("div");
        row.style.cssText="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f8fafc;font-size:13px;color:#0f172a;";
        const timeStr=c.time?`<span style="font-size:11px;color:#94a3b8;flex-shrink:0;width:40px;">${c.time}</span>`:'<span style="width:40px;"></span>';
        row.innerHTML=timeStr+`<span>${c.name||''}</span>`;
        detail.appendChild(row);
      });
    } else {
      detail.innerHTML='<div style="font-size:13px;color:#94a3b8;text-align:center;padding:8px;">저장된 일정 없음</div>';
    }

    div.appendChild(detail);

    // 불러오기 버튼
    const restoreBtn=document.createElement("button");
    restoreBtn.style.cssText="display:block;width:calc(100% - 32px);margin:0 16px 12px;padding:10px;border-radius:10px;border:none;background:#0891b2;color:#fff;font-size:13px;font-weight:600;cursor:pointer;";
    restoreBtn.textContent="↩️ 이 여행 불러오기";
    restoreBtn.onclick=(e)=>{e.stopPropagation();restoreTrip(trip,idx);};
    detail.appendChild(restoreBtn);

    // 헤더 클릭 시 토글
    header.style.cursor="pointer";
    const chevron=header.querySelector("span:last-child");
    header.onclick=()=>{
      const isOpen=detail.style.display!=="none";
      detail.style.display=isOpen?"none":"block";
      if(chevron)chevron.style.transform=isOpen?"":"rotate(180deg)";
    };

    // 삭제 버튼
    const delBtn=document.createElement("button");
    delBtn.className="archive-del-btn";
    delBtn.innerHTML="✕";
    delBtn.title="기록 삭제";
    delBtn.onclick=(e)=>{e.stopPropagation();deleteArchiveTrip(idx);};
    div.appendChild(delBtn);
  }
  return div;
}

function restoreTrip(trip, idx){
  if(!confirm(`"${trip.name}" 여행을 불러올까요?\n\n현재 여행은 기록으로 저장한 뒤 교체됩니다.`))return;

  // 1. 현재 여행 기록 저장
  saveCurrentToArchive();

  setTimeout(()=>{
    // 2. Firebase 초기화
    if(window._fbReady){
      const{set:fbSet,ref:fbRef,db:fbDb}=window._fb;
      fbSet(fbRef(fbDb,'danang_cards'), trip.cards && trip.cards.length ? null : null);
      fbSet(fbRef(fbDb,'danang_deleted'), null);
      fbSet(fbRef(fbDb,'danang_title'), trip.name||'여행');
      fbSet(fbRef(fbDb,'danang_date'), trip.date||'');
      fbSet(fbRef(fbDb,'danang_banners'), null);
      fbSet(fbRef(fbDb,'danang_tab_labels'), null);
    }
    localStorage.removeItem('danang_deleted');

    // 3. 제목·날짜 복원
    const titleEl=document.getElementById('heroTitle');
    const dateEl=document.getElementById('heroDate');
    if(titleEl)titleEl.textContent=trip.name||'여행';
    if(dateEl)dateEl.textContent=trip.date||'';

    // 4. 기존 카드 전체 삭제
    document.querySelectorAll('.cards').forEach(c=>c.innerHTML='');

    // 5. 저장된 카드 복원
    if(trip.cards && trip.cards.length){
      trip.cards.forEach(c=>{
        const container=document.querySelector('#'+(c.tab||'day0')+' .cards');
        if(!container)return;
        const id='uc'+Date.now()+Math.random().toString(36).slice(2,6);
        const data={time:c.time||'',name:c.name||'',icon:'🗺️',tag:'',tagStyle:'tag-blue',place:'',cost:'',duration:'',tip:'',imgs:'[]'};
        container.insertAdjacentHTML('beforeend',buildCard(id,data));
        setTimeout(()=>attachCardButtons(id),100);
      });
      showToast('✅ '+trip.name+' 불러오기 완료');
      saveCardsToFirebase();
    } else {
      showToast('✅ 제목·날짜를 복원했습니다. 일정은 직접 추가해주세요.');
    }

    // 6. 출발전 탭으로 이동
    const firstBtn=document.querySelector('.tab-btn');
    if(firstBtn)showTab('day0',firstBtn);
  }, 600);
}

function deleteArchiveTrip(idx){
  if(!confirm("이 여행 기록을 삭제할까요?"))return;
  const{ref:fbRef,db:fbDb,set:fbSet}=window._fb;
  const{onValue}=window._fbMod||{};
  onValue(fbRef(fbDb,"danang_archive"),(snap)=>{
    const trips=snap.val()||[];
    trips.splice(idx,1);
    fbSet(fbRef(fbDb,"danang_archive"),trips.length?trips:null);
    showToast("🗑 여행 기록이 삭제되었습니다");
    renderArchive();
  },{onlyOnce:true});
}

function startNewTrip(){
  if(!confirm('현재 여행을 기록으로 저장하고 새 여행을 시작할까요?\n\n- 제목·날짜 초기화\n- 모든 카드 삭제\n- Firebase 데이터 초기화'))return;
  // 1. 현재 여행 기록 저장
  saveCurrentToArchive();
  setTimeout(()=>{
    // 2. Firebase 카드/삭제목록 초기화
    if(window._fbReady){
      const{set:fbSet,ref:fbRef,db:fbDb}=window._fb;
      fbSet(fbRef(fbDb,'danang_cards'),null);
      fbSet(fbRef(fbDb,'danang_deleted'),null);
    }
    localStorage.removeItem('danang_deleted');
    // 모든 탭 카드 초기화 (정적 카드 포함)
    const staticCardIds=[];
    document.querySelectorAll('.tab-content').forEach(tab=>{
      if(tab.id==='archive')return;
      tab.querySelectorAll('.card').forEach(c=>staticCardIds.push(c.id));
      const cards=tab.querySelector('.cards');
      if(cards)cards.innerHTML='';
    });
    // 정적 카드 ID를 deleted 목록에 저장 → 새로고침 후에도 안 나타나게
    if(window._fbReady&&staticCardIds.length){
      const{set:fbSet,ref:fbRef,db:fbDb}=window._fb;
      fbSet(fbRef(fbDb,'danang_deleted'),staticCardIds);
      localStorage.setItem('danang_deleted',JSON.stringify(staticCardIds));
    }
    // 새 여행 플래그 — Firebase onValue가 다시 카드를 그리지 않도록
    window._newTripMode=true;
    // 3. DOM 카드 삭제 — 출발전(day0)은 유지, 나머지 삭제
    document.querySelectorAll('.tab-content').forEach(tab=>{
      if(tab.id==='day0'||tab.id==='archive')return;
      const cards=tab.querySelector('.cards');
      if(cards)cards.innerHTML='';
    });
    // 4. 제목·날짜 초기화
    const title=document.getElementById('heroTitle');
    const date=document.getElementById('heroDate');
    if(title){title.textContent='✈️ 새 여행';saveHeroTitle(title.textContent);}
    if(date){date.textContent='날짜를 입력하세요';saveHeroDate(date.textContent);}
    // 배너 초기화
    const bannerDefaults={day0:'PRE-DEPARTURE · 출발 준비',day1:'DAY 1',day2:'DAY 2',day3:'DAY 3',day4:'DAY 4',day5:'DAY 5',day6:'DAY 6'};
    Object.entries(bannerDefaults).forEach(([id,txt])=>{
      const el=document.getElementById('banner-'+id);
      if(el)el.textContent=txt;
    });
    // 탭 라벨 초기화
    const defaultLabels={day0:'출발전',day1:'Day1',day2:'Day2',day3:'Day3',day4:'Day4',day5:'Day5',day6:'귀국'};
    Object.entries(defaultLabels).forEach(([id,txt])=>{
      const el=document.getElementById('tabl-'+id);
      if(el)el.textContent=txt;
      DAY_LABELS[id]=txt;
    });
    // Firebase 초기화
    if(window._fbReady){
      const{set:fbSet,ref:fbRef,db:fbDb}=window._fb;
      fbSet(fbRef(fbDb,'danang_banners'),null);
      fbSet(fbRef(fbDb,'danang_tab_labels'),null);
      fbSet(fbRef(fbDb,'danang_tab_count'),null);
    }
    // 추가된 Day탭(Day7+) 제거
    const tabScroll=document.querySelector('.tab-scroll');
    const extraBtns=[...tabScroll.querySelectorAll('span[id^="tabl-day"]')]
      .filter(s=>parseInt(s.id.replace('tabl-day',''))>6)
      .map(s=>s.closest('.tab-btn'));
    extraBtns.forEach(btn=>{
      const dayId=btn.querySelector('span')?.id?.replace('tabl-','');
      if(dayId){
        const tabContent=document.getElementById(dayId);
        if(tabContent)tabContent.remove();
        delete DAY_LABELS[dayId];
      }
      btn.remove();
    });
    // 5. 출발전 탭으로 이동
    const firstBtn=document.querySelector('.tab-btn');
    if(firstBtn)showTab('day0',firstBtn);
    showToast('✅ 새 여행이 시작되었습니다. 제목과 날짜를 수정해주세요.');
    // 6. 제목 바로 편집
    setTimeout(()=>{
      if(title){title.focus();const r=document.createRange();r.selectNodeContents(title);const s=window.getSelection();s.removeAllRanges();s.addRange(r);}
    },200);
  },600);
}

function saveCurrentToArchive(){
  if(!window._fbReady){showToast("로그인 후 이용해주세요.");return;}
  const{ref:fbRef,db:fbDb,set:fbSet}=window._fb;
  const{onValue}=window._fbMod||{};
  if(!onValue)return;
  // 현재 카드 목록 수집
  const cardSnapshot=[];
  document.querySelectorAll(".tab-content").forEach(tab=>{
    if(tab.id==="archive")return;
    tab.querySelectorAll(".card").forEach(card=>{
      const nameEl=card.querySelector(".card-name");
      cardSnapshot.push({tab:tab.id,time:card.dataset.time||"",name:nameEl?nameEl.textContent.replace(/\s*●\s*$/,"").trim():""});
    });
  });
  onValue(fbRef(fbDb,"danang_archive"),(snap)=>{
    const trips=snap.val()||[];
    const newTrip={
      name:document.getElementById("heroTitle").textContent.trim(),
      date:document.getElementById("heroDate").textContent.trim(),
      color:ARCHIVE_COLORS[trips.length%ARCHIVE_COLORS.length],
      savedAt:new Date().toISOString(),
      cards:cardSnapshot
    };
    trips.push(newTrip);
    fbSet(fbRef(fbDb,"danang_archive"),trips);
    showToast("✅ 여행기록에 저장되었습니다");
  },{onlyOnce:true});
}

function addDayTab(){
  // 현재 day 탭 수 파악
  const tabScroll=document.querySelector('.tab-scroll');
  const dayBtns=[...tabScroll.querySelectorAll('.tab-btn')].filter(b=>b.querySelector('span[id^="tabl-day"]')&&!b.querySelector('span[id="tabl-day0"]'));
  const nextNum=dayBtns.length+1;
  const newId='day'+nextNum;
  if(document.getElementById(newId))return; // 이미 존재

  // 탭 버튼 추가 (여행기록 탭 앞에)
  const archiveBtn=document.getElementById('archiveTabBtn')?.closest('button.tab-btn')||tabScroll.querySelector('button[id="archiveTabBtn"]')?.parentElement;
  const divider=tabScroll.querySelector('div[style*="background:var(--border)"]');
  const newBtn=document.createElement('button');
  newBtn.className='tab-btn';
  newBtn.onclick=function(){showTab(newId,this);};
  const label='Day'+nextNum;
  newBtn.innerHTML=`<span id="tabl-${newId}" ondblclick="editTabLabel(event,'${newId}')">${label}</span>`;
  if(divider)tabScroll.insertBefore(newBtn,divider);
  else tabScroll.appendChild(newBtn);

  // 탭 콘텐츠 추가
  const archiveContent=document.getElementById('archive');
  const newContent=document.createElement('div');
  newContent.className='tab-content';
  newContent.id=newId;
  newContent.innerHTML=`<div class="day-banner blue"><div class="db-left"><div class="db-day" id="banner-${newId}" contenteditable="true" style="outline:none;cursor:text;" onblur="saveBanner('${newId}',this.textContent)">DAY ${nextNum} · 날짜를 입력하세요</div></div></div><div class="cards"></div>`;
  archiveContent.parentElement.insertBefore(newContent,archiveContent);

  // DAY_LABELS 업데이트
  DAY_LABELS[newId]=label;

  // Firebase 저장
  if(window._fbReady){
    const{set:fbSet,ref:fbRef,db:fbDb}=window._fb;
    fbSet(fbRef(fbDb,'danang_tab_labels/'+newId),label);
    fbSet(fbRef(fbDb,'danang_tab_count'),nextNum);
  }
  showToast('✅ Day'+nextNum+' 탭이 추가되었습니다');
  showTab(newId,newBtn);
}

function removeLastDayTab(){
  const tabScroll=document.querySelector('.tab-scroll');
  const daySpans=[...tabScroll.querySelectorAll('span[id^="tabl-day"]')].filter(s=>s.id!=='tabl-day0');
  if(daySpans.length===0){showToast('삭제할 탭이 없습니다');return;}
  const lastSpan=daySpans[daySpans.length-1];
  const lastId=lastSpan.id.replace('tabl-','');
  const lastBtn=lastSpan.closest('.tab-btn');
  if(!confirm('Day'+lastId.replace('day','')+' 탭과 해당 카드를 모두 삭제할까요?'))return;

  // 카드 삭제
  const tabContent=document.getElementById(lastId);
  if(tabContent)tabContent.remove();

  // 탭 버튼 삭제
  if(lastBtn)lastBtn.remove();

  // Firebase 정리
  if(window._fbReady){
    const{set:fbSet,ref:fbRef,db:fbDb}=window._fb;
    fbSet(fbRef(fbDb,'danang_tab_labels/'+lastId),null);
    const remaining=daySpans.length-1;
    fbSet(fbRef(fbDb,'danang_tab_count'),remaining);
  }
  delete DAY_LABELS[lastId];

  // 이전 탭으로 이동
  const prevBtn=tabScroll.querySelectorAll('.tab-btn');
  const lastVisible=prevBtn[prevBtn.length-3]; // 여행기록, divider 제외
  if(lastVisible)showTab(lastVisible.querySelector('span')?.id?.replace('tabl-','')?.replace('archiveTabBtn','')|| 'day0', lastVisible);
  else{const d0=document.querySelector('.tab-btn');if(d0)showTab('day0',d0);}
  showToast('🗑 탭이 삭제되었습니다');
}

function saveBanner(dayId, text){
  if(!text||!window._fbReady)return;
  const{set:fbSet,ref:fbRef,db:fbDb}=window._fb;
  fbSet(fbRef(fbDb,'danang_banners/'+dayId),text);
}

function editTabLabel(e, dayId){
  e.stopPropagation();
  const span=document.getElementById('tabl-'+dayId);
  if(!span)return;
  const current=span.textContent;
  const input=document.createElement('input');
  input.value=current;
  input.style.cssText='width:100px;font-size:13px;font-weight:600;color:#0891b2;border:none;border-bottom:2px solid #0891b2;background:transparent;outline:none;padding:0;';
  span.textContent='';
  span.appendChild(input);
  input.focus();
  input.select();
  const save=()=>{
    const val=input.value.trim()||current;
    span.textContent=val;
    DAY_LABELS[dayId]=val;
    // Firebase 저장
    if(window._fbReady){
      const{set:fbSet,ref:fbRef,db:fbDb}=window._fb;
      fbSet(fbRef(fbDb,'danang_tab_labels/'+dayId),val);
    }
  };
  input.onblur=save;
  input.onkeydown=(ev)=>{if(ev.key==='Enter'){ev.preventDefault();input.blur();}if(ev.key==='Escape'){span.textContent=current;input.remove();}};
}

// URL → 클릭 가능한 링크로 변환
function linkify(text){
  if(!text)return '';
  return text.replace(/(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener" style="color:#0891b2;text-decoration:underline;word-break:break-all;">$1</a>');
}

// 시트 열린 상태에서 전역 붙여넣기
document.addEventListener('paste', (e)=>{
  const backdrop=document.getElementById('sheetBackdrop');
  if(!backdrop||!backdrop.classList.contains('open'))return;
  const items=[...(e.clipboardData?.items||[])];
  const imgItem=items.find(it=>it.type.startsWith('image/'));
  if(!imgItem)return;
  // 빈 슬롯 찾기, 없으면 새 슬롯 추가
  const grid=document.getElementById('imgUploadGrid');
  if(!grid)return;
  const emptySlot=[...grid.children].find(item=>{
    const s=item.querySelector('.img-upload-slot');
    return s&&!s.classList.contains('has-img');
  });
  if(emptySlot){
    const idx=parseInt(emptySlot.dataset.idx);
    const file=imgItem.getAsFile();
    if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      const slot=document.getElementById('imgSlot'+idx);
      let img=slot.querySelector('img');
      if(!img){
        img=document.createElement('img');
        img.style.cssText='width:100%;height:auto;display:block;position:relative;z-index:0;';
        slot.insertBefore(img,slot.firstChild);
      }
      img.src=ev.target.result;
      slot.classList.add('has-img');
      const plus=slot.querySelector('.slot-plus');
      if(plus)plus.style.display='none';
      if(uploadedImgs[idx])uploadedImgs[idx].src=ev.target.result;
    };
    reader.readAsDataURL(file);
  } else {
    // 빈 슬롯 없으면 새로 추가 후 붙여넣기
    addImgSlot();
    setTimeout(()=>{
      const newIdx=grid.children.length-1;
      const file=imgItem.getAsFile();
      if(!file)return;
      const reader=new FileReader();
      reader.onload=(ev)=>{
        const slot=document.getElementById('imgSlot'+newIdx);
        if(!slot)return;
        let img=slot.querySelector('img');
        if(!img){
          img=document.createElement('img');
          img.style.cssText='width:100%;height:auto;display:block;position:relative;z-index:0;';
          slot.insertBefore(img,slot.firstChild);
        }
        img.src=ev.target.result;
        slot.classList.add('has-img');
        const plus=slot.querySelector('.slot-plus');
        if(plus)plus.style.display='none';
        if(uploadedImgs[newIdx])uploadedImgs[newIdx].src=ev.target.result;
      };
      reader.readAsDataURL(file);
    },50);
  }
  e.preventDefault();
});

function saveCardsToFirebase(){
  if(!window._fbReady)return;
  const allCards=[];
  document.querySelectorAll('.tab-content').forEach(tab=>{
    if(tab.id==='archive')return; // 여행기록 탭 제외
    tab.querySelectorAll('.card').forEach(card=>{
      if(!card.dataset.name&&!card.querySelector('.card-name'))return;// 빈 카드 스킵
      const nameEl=card.querySelector('.card-name');
      const decode=s=>(s||'').replace(/&quot;/g,'"').replace(/&#10;/g,'\n').replace(/&amp;/g,'&');
      const nameEl2=card.querySelector('.card-name');
      const cardName=decode(card.dataset.name)||(nameEl2?nameEl2.textContent.replace(/\s*●\s*$/,'').trim():'');
      if(!cardName)return;
      allCards.push({
        id:card.id,tab:tab.id,
        time:card.dataset.time||'',
        name:cardName,
        icon:decode(card.dataset.icon)||'🗺️',
        tag:decode(card.dataset.tag)||'',
        tagStyle:card.dataset.tagStyle||'tag-blue',
        place:decode(card.dataset.place)||'',
        cost:decode(card.dataset.cost)||'',
        duration:decode(card.dataset.duration)||'',
        tip:decode(card.dataset.tip)||'',
        imgs:card.dataset.imgs||'[]',
      });
    });
  });
  const{set:fbSet,ref:fbRef,db:fbDb}=window._fb;
  fbSet(fbRef(fbDb,'danang_cards'),allCards.length?allCards:null);
}

// ── 이미지 업로드 ──
let uploadedImgs=[];// [{src, caption}]

function addImgSlot(srcData, captionData){
  const grid=document.getElementById('imgUploadGrid');
  const idx=grid.children.length;
  const item=document.createElement('div');
  item.className='img-upload-item';
  item.dataset.idx=idx;

  const slot=document.createElement('div');
  slot.className='img-upload-slot'+(srcData?' has-img':'');
  slot.id='imgSlot'+idx;

  // 플러스 아이콘 (이미지 없을 때)
  const plusIcon=document.createElement('span');
  plusIcon.className='slot-plus';
  plusIcon.textContent='➕';
  plusIcon.style.cssText='position:relative;z-index:0;pointer-events:none;';
  slot.appendChild(plusIcon);

  // 파일 input — 슬롯 전체를 덮되 z-index 낮게
  const fileInput=document.createElement('input');
  fileInput.type='file';
  fileInput.accept='image/*';
  fileInput.style.cssText='position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;z-index:1;';
  fileInput.onchange=(e)=>{handleImgUpload(idx,e.target);};
  slot.appendChild(fileInput);

  // 삭제 버튼 — z-index 높게
  const delBtn=document.createElement('button');
  delBtn.className='del-img';
  delBtn.innerHTML='✕';
  delBtn.style.zIndex='3';
  delBtn.onclick=(e)=>{e.stopPropagation();e.preventDefault();removeImgSlot(item);};
  slot.appendChild(delBtn);

  if(srcData){
    const img=document.createElement('img');
    img.src=srcData;
    img.style.cssText='width:100%;height:auto;display:block;position:relative;z-index:0;';
    slot.insertBefore(img,slot.firstChild);
    plusIcon.style.display='none';
  }

  const caption=document.createElement('textarea');
  caption.className='img-caption';
  caption.placeholder='사진 설명을 입력하세요...';
  caption.rows=1;
  caption.value=captionData||'';
  caption.oninput=function(){this.style.height='auto';this.style.height=this.scrollHeight+'px';};

  item.appendChild(slot);
  item.appendChild(caption);
  grid.appendChild(item);

  uploadedImgs.push({src:srcData||null,caption:captionData||''});

  // 붙여넣기 지원
  slot.addEventListener('paste', (e)=>{
    e.preventDefault();
    const items=[...(e.clipboardData?.items||[])];
    const imgItem=items.find(it=>it.type.startsWith('image/'));
    if(!imgItem)return;
    const file=imgItem.getAsFile();
    if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      const currentIdx=parseInt(item.dataset.idx);
      let img=slot.querySelector('img');
      if(!img){
        img=document.createElement('img');
        img.style.cssText='width:100%;height:auto;display:block;position:relative;z-index:0;';
        slot.insertBefore(img,slot.firstChild);
      }
      img.src=ev.target.result;
      slot.classList.add('has-img');
      const plus=slot.querySelector('.slot-plus');
      if(plus)plus.style.display='none';
      if(uploadedImgs[currentIdx])uploadedImgs[currentIdx].src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function handleImgUpload(idx,input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    const slot=document.getElementById('imgSlot'+idx);
    let img=slot.querySelector('img');
    if(!img){
      img=document.createElement('img');
      img.style.cssText='width:100%;height:auto;display:block;position:relative;z-index:0;';
      slot.insertBefore(img,slot.firstChild);
    }
    img.src=e.target.result;
    slot.classList.add('has-img');
    const plus=slot.querySelector('.slot-plus');
    if(plus)plus.style.display='none';
    if(uploadedImgs[idx])uploadedImgs[idx].src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function removeImgSlot(item){
  const grid=document.getElementById('imgUploadGrid');
  const idx=parseInt(item.dataset.idx);
  item.remove();
  uploadedImgs.splice(idx,1);
  // idx 재정렬
  [...grid.children].forEach((el,i)=>{
    el.dataset.idx=i;
    const slot=el.querySelector('.img-upload-slot');
    if(slot)slot.id='imgSlot'+i;
  });
}

function clearAllImgSlots(){
  uploadedImgs=[];
  const grid=document.getElementById('imgUploadGrid');
  if(grid)grid.innerHTML='';
}

function loadImgsToSlots(imgs){
  clearAllImgSlots();
  if(!Array.isArray(imgs)||!imgs.length)return;
  imgs.forEach(item=>{
    if(typeof item==='string') addImgSlot(item,'');
    else if(item&&item.src) addImgSlot(item.src,item.caption||'');
  });
}

function getImgsData(){
  const grid=document.getElementById('imgUploadGrid');
  const result=[];
  [...grid.children].forEach((item,i)=>{
    const slot=item.querySelector('.img-upload-slot');
    const cap=item.querySelector('.img-caption');
    const src=uploadedImgs[i]?.src||null;
    if(src)result.push({src,caption:cap?.value||''});
  });
  return result;
}
